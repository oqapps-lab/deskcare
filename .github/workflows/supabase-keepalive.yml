name: Keep Supabase warm

# Free-tier Supabase auto-pauses after 7 days of inactivity. This pings the
# project's REST API every 3 days at 12:00 UTC so it never sleeps.
# Anon keys are public-by-design (embedded in mobile clients), so checking
# them into the workflow file is intentional and safe.

on:
  schedule:
    # 12:00 UTC every 3 days (sleep window is 7 days, 3-day pings have safe margin)
    - cron: "0 12 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DeskCare REST API
        run: |
          curl --fail --silent --show-error \
            -H "apikey: sb_publishable_6_ABCMySEUKLDegbZmkcyg_4x-X5Q39" \
            "https://wnmjdxmrpmucfoluxhly.supabase.co/rest/v1/exercises?select=count" \
            | head -c 200
          echo ""
          echo "DeskCare ping OK at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
